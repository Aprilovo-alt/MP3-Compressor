<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LESS / 文件工具箱</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f3f3f3;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:840px;margin:auto;padding:46px 22px 90px}header{border-bottom:1px solid #333;padding-bottom:35px}.eyebrow{letter-spacing:4px;font-size:11px;color:#999}h1{font-size:clamp(42px,9vw,80px);letter-spacing:-4px;line-height:1;margin:24px 0}p{color:#aaa;line-height:1.8}nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:32px 0}button,select{font:inherit;border:1px solid #444;background:#1b1b1e;color:white;border-radius:12px;padding:15px;cursor:pointer}nav button.active{background:#eee;color:#111}section{border:1px solid #363639;background:#141416;border-radius:22px;padding:clamp(22px,5vw,42px)}h2{font-size:28px;margin:0 0 12px}.drop{display:block;border:1px dashed #666;border-radius:16px;text-align:center;padding:40px 15px;margin:28px 0;cursor:pointer;font-weight:700;font-size:19px}.drop small{display:block;color:#999;font-weight:400;font-size:13px;margin-top:12px;overflow-wrap:anywhere}input[type=file]{display:none}label.opt{display:block;margin:18px 0 8px;color:#bbb}select{width:100%}.primary{background:#f2f2f2;color:#111;width:100%;margin-top:25px;font-weight:700}button:disabled{opacity:.5;cursor:wait}#status{margin-top:20px;white-space:pre-wrap;overflow-wrap:anywhere;color:#bbb}#result{margin-top:16px}a.download{display:block;background:#eee;color:#111;text-align:center;padding:16px;border-radius:12px;text-decoration:none;font-weight:700}progress{width:100%;height:9px;accent-color:white;margin-top:16px}footer{margin-top:28px;font-size:12px;color:#777}#hint{font-size:13px}
</style></head><body><main><header><div class="eyebrow">LOCAL FILE UTILITY / 001</div><h1>LESS SIZE.<br>MORE POSSIBILITIES.</h1><p>一个简单的本地文件处理工具箱。文件在浏览器中处理，不上传至本站服务器。</p></header>
<nav id="tabs"><button class="active" data-mode="audio">MP3 压缩</button><button data-mode="video">视频压缩</button><button data-mode="extract">视频转 MP3</button><button data-mode="wordpdf">Word → PDF</button><button data-mode="pdfword">PDF → Word</button></nav>
<section><h2 id="heading">MP3 压缩</h2><p id="hint">降低音频码率以减小文件体积。</p><label class="drop" for="file">＋ 选择文件<small id="filename">点击上传本地文件</small></label><input id="file" type="file" accept=".mp3,audio/*"><div id="setting"><label class="opt" for="quality">输出质量</label><select id="quality"></select></div><button class="primary" id="go">开始处理 / CONVERT</button><progress id="progress" max="100" value="0" hidden></progress><div id="status" role="status">准备就绪</div><div id="result"></div></section><footer>PRIVATE BY DESIGN · NO FILE UPLOAD<br>首次使用需联网加载处理引擎。较大的视频可能因设备内存不足而失败。扫描版 PDF 无法直接提取文字。</footer></main>
<script type="module">
const $=id=>document.getElementById(id),file=$('file'),go=$('go'),status=$('status'),result=$('result'),quality=$('quality'),setting=$('setting'),progress=$('progress');
const cfg={audio:['MP3 压缩','降低音频码率以减小文件体积。','.mp3,audio/*',[['128','128 kbps · 高音质'],['96','96 kbps · 推荐'],['64','64 kbps · 更小'],['32','32 kbps · 语音']]],video:['视频压缩','降低分辨率与视频码率，输出 MP4。','.mp4,.mov,.webm,.mkv,video/*',[['1200','标准 · 720p / 1200 kbps'],['700','更小 · 480p / 700 kbps'],['2000','清晰 · 720p / 2000 kbps']]],extract:['视频转 MP3','提取视频中的音轨，保存为 MP3。','.mp4,.mov,.webm,.mkv,video/*',[['192','192 kbps'],['128','128 kbps'],['96','96 kbps']]],wordpdf:['Word 转 PDF','支持 DOCX；尽量保留文本和基础格式。复杂排版可能变化。','.docx',[]],pdfword:['PDF 转 Word','提取可选中文本并生成 DOCX；不支持扫描件 OCR，原排版可能丢失。','.pdf',[]]};
let mode='audio',ff=null,objectURL=null;
function render(){const c=cfg[mode];$('heading').textContent=c[0];$('hint').textContent=c[1];file.accept=c[2];file.value='';$('filename').textContent='点击上传本地文件';setting.hidden=!c[3].length;quality.replaceChildren(...c[3].map(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;return o}));if(mode==='audio')quality.value='96';result.replaceChildren();status.textContent='准备就绪';progress.hidden=true;}
$('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-mode]');if(!b||go.disabled)return;mode=b.dataset.mode;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
file.onchange=()=>{$('filename').textContent=file.files[0]?file.files[0].name+' · '+size(file.files[0].size):'点击上传本地文件'};
function size(n){return (n/1048576).toFixed(2)+' MB'}
function download(blob,name){if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);let a=document.createElement('a');a.className='download';a.href=objectURL;a.download=name;a.textContent='下载结果 / DOWNLOAD · '+size(blob.size);result.replaceChildren(a);}
const base=n=>n.replace(/\.[^.]+$/,'');
async function media(f){if(!ff){status.textContent='首次加载音视频引擎（约 30 MB），请稍候…';const [{FFmpeg},{toBlobURL,fetchFile}]=await Promise.all([import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js'),import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js')]);ff=new FFmpeg();ff.on('progress',({progress:p})=>{if(Number.isFinite(p)){progress.value=Math.max(0,Math.min(99,p*100));}});const root='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';await ff.load({classWorkerURL:new URL('./ffmpeg-worker.js',import.meta.url).href,coreURL:await toBlobURL(root+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(root+'/ffmpeg-core.wasm','application/wasm')});ff.fetchFile=fetchFile;}const input='input'+(f.name.match(/\.[^.]+$/)?.[0]||'.mp4'),output=mode==='video'?'output.mp4':'output.mp3';await ff.writeFile(input,await ff.fetchFile(f));let args;if(mode==='audio')args=['-i',input,'-vn','-codec:a','libmp3lame','-b:a',quality.value+'k',output];else if(mode==='extract')args=['-i',input,'-vn','-codec:a','libmp3lame','-b:a',quality.value+'k',output];else args=['-i',input,'-vf',quality.value==='700'?'scale=-2:480':'scale=-2:720','-c:v','libx264','-preset','ultrafast','-b:v',quality.value+'k','-c:a','aac','-b:a','96k','-movflags','+faststart',output];status.textContent='正在处理，请保持网页打开…';const rc=await ff.exec(args);if(rc!==0)throw Error('转码失败，文件格式可能不受支持。');const data=await ff.readFile(output);download(new Blob([data],{type:mode==='video'?'video/mp4':'audio/mpeg'}),base(f.name)+(mode==='video'?'_compressed.mp4':mode==='audio'?'_compressed.mp3':'.mp3'));await ff.deleteFile(input);await ff.deleteFile(output);return data.length;}
async function wordToPdf(f){status.textContent='正在读取 Word 文档…';const mammoth=await import('https://esm.sh/mammoth@1.9.1/mammoth.browser');const {jsPDF}=await import('https://esm.sh/jspdf@2.5.2');const {html}=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});const box=document.createElement('div');box.innerHTML=html;box.style.cssText='position:fixed;left:-10000px;top:0;width:700px;background:white;color:black;font:16px Arial;padding:24px';document.body.append(box);try{status.textContent='正在生成 PDF（复杂格式可能有变化）…';const pdf=new jsPDF({unit:'pt',format:'a4'});await pdf.html(box,{callback:()=>{},x:25,y:25,width:545,windowWidth:750,autoPaging:'text',html2canvas:{scale:.8,backgroundColor:'#fff'}});download(pdf.output('blob'),base(f.name)+'.pdf');}finally{box.remove()}}
async function pdfToWord(f){status.textContent='正在读取 PDF 文本…';const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';const docx=await import('https://esm.sh/docx@9.1.1');const doc=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let children=[];for(let i=1;i<=doc.numPages;i++){status.textContent='正在提取第 '+i+'/'+doc.numPages+' 页';const page=await doc.getPage(i);const items=(await page.getTextContent()).items;let lines=[],line=[],lastY=null;for(const item of items){const y=item.transform?.[5]??0;if(lastY!==null&&Math.abs(y-lastY)>4){lines.push(line.join(' '));line=[]}line.push(item.str);lastY=y;}if(line.length)lines.push(line.join(' '));children.push(...lines.map(s=>new docx.Paragraph({text:s})));if(i<doc.numPages)children.push(new docx.Paragraph({pageBreakBefore:true}));}if(!children.some(p=>p))throw Error('没有可提取的文本');const d=new docx.Document({sections:[{children}]});download(await docx.Packer.toBlob(d),base(f.name)+'.docx');}
go.onclick=async()=>{const f=file.files[0];if(!f){status.textContent='请先选择文件。';return}go.disabled=true;result.replaceChildren();progress.hidden=false;progress.value=0;try{if(['audio','video','extract'].includes(mode))await media(f);else if(mode==='wordpdf')await wordToPdf(f);else await pdfToWord(f);progress.value=100;status.textContent='处理完成。原文件：'+size(f.size);}catch(e){console.error(e);status.textContent='处理失败：'+(e.message||e)+'。可尝试 Chrome / Edge，或更小的文件。';}finally{go.disabled=false;}};render();
</script></body></html>
